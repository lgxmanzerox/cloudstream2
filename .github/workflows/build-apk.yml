                name: Build Android APK (assembleStableRelease · arm64-v8a)

                on:
                  push:
                    branches: [ main, master ]
                  workflow_dispatch:

                jobs:
                  build:
                    runs-on: ubuntu-latest
                    steps:
                      - name: Checkout repository
                        uses: actions/checkout@v4

                      - name: Set up JDK 17
                        uses: actions/setup-java@v4
                        with:
                          java-version: '17'
                          distribution: 'temurin'

                      - name: Ensure signing keystores
                        run: |
                          if [ ! -f debug.keystore ]; then
                            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
                          fi
                          if [ ! -f app/debug.keystore ]; then
                            cp debug.keystore app/debug.keystore
                          fi

                      - name: Setup Gradle
                        uses: gradle/actions/setup-gradle@v4
                
- name: Configure single ABI filter (arm64-v8a) to reduce APK size
  run: |
    cat << 'EOF' > abi-filter.init.gradle
    allprojects {
        afterEvaluate { project ->
            if (project.plugins.hasPlugin("com.android.application")) {
                try {
                    project.android.defaultConfig.ndk.abiFilters.clear()
                    project.android.defaultConfig.ndk.abiFilters.add("arm64-v8a")
                } catch (ignored) {}
                try {
                    project.android.splits.abi {
                        enable = true
                        reset()
                        include("arm64-v8a")
                        universalApk = false
                    }
                } catch (ignored) {}
            }
        }
    }
    EOF

                      - name: Build APK (assembleStableRelease)
                        run: |
                          if [ -f ./gradlew ]; then
                            chmod +x ./gradlew
                            ./gradlew assembleStableRelease -Pandroid.injected.build.abi=arm64-v8a --init-script abi-filter.init.gradle --no-daemon --stacktrace
                          else
                            gradle assembleStableRelease -Pandroid.injected.build.abi=arm64-v8a --init-script abi-filter.init.gradle --no-daemon --stacktrace
                          fi

                      - name: Upload APK artifact
                        uses: actions/upload-artifact@v4
                        with:
                          name: app-apk-arm64-v8a
                          path: |
                            **/build/outputs/apk/*release*/*.apk
                            **/build/outputs/apk/**/*.apk
                          if-no-files-found: error