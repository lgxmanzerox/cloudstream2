name: Build Android APK (assembleRelease · armeabi-v7a)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure signing keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/debug.keystore ]; then
            cp debug.keystore app/debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure ABI filter and Release Signing
        run: |
          cat << 'EOF' > custom-build.init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      try {
                          // 1. إجبار نسخة الـ Release على استخدام مفتاح الديباج
                          project.android.buildTypes.release.signingConfig = project.android.signingConfigs.debug
                          
                          // 2. تصفية المعمارية إلى armeabi-v7a فقط
                          project.android.defaultConfig.ndk.abiFilters.clear()
                          project.android.defaultConfig.ndk.abiFilters.add("armeabi-v7a")
                          
                          project.android.splits.abi {
                              enable = true
                              reset()
                              include("armeabi-v7a")
                              universalApk = false
                          }
                      } catch (ignored) {}
                  }
              }
          }
          EOF

      - name: Build APK (assembleRelease)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --init-script custom-build.init.gradle --no-daemon --stacktrace
          else
            gradle assembleRelease --init-script custom-build.init.gradle --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-armeabi-v7a
          path: |
            **/build/outputs/apk/*release*/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error