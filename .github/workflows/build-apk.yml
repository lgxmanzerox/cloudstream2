name: Build Android APK (Stable Release · armeabi-v7a)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure signing keystores
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/debug.keystore ]; then
            cp debug.keystore app/debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release Signing and ABI Split
        run: |
          cat << 'EOF' > custom-build.init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      // 1. إجبار نسخة الـ Release على استخدام مفتاح الديباج
                      project.android.buildTypes.release.signingConfig = project.android.signingConfigs.debug
                      
                      // 2. تصفية المعمارية إلى armeabi-v7a فقط (بدون تعارض)
                      project.android.splits.abi {
                          enable = true
                          reset()
                          include("armeabi-v7a")
                          universalApk = false
                      }
                  }
              }
          }
          EOF

      - name: Build Stable Release APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleStableRelease --init-script custom-build.init.gradle --no-daemon --stacktrace
          else
            gradle assembleStableRelease --init-script custom-build.init.gradle --no-daemon --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-stable-release-armeabi-v7a
          path: |
            **/build/outputs/apk/stable/release/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error